{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل مجری</title>
  <link rel="stylesheet" href="{% static 'contest/style.css' %}">
</head>
<body class="page-host-home">
<div class="wrap">
  <h2>پنل مجری</h2>
  <form method="post" class="card">
    {% csrf_token %}
    <b>ساخت مسابقه‌ی جدید</b>
    <select name="quiz" required>
      {% for q in quizzes %}<option value="{{ q.id }}">{{ q.title }}</option>{% endfor %}
    </select>
    <button type="submit">ساخت Session و رفتن به پنل</button>
  </form>
  <div class="card">
    <b>Sessionهای باز</b>
    <ul>
      {% for s in sessions %}
        <li><a href="{% url 'contest:host' s.code %}">{{ s.quiz.title }} - {{ s.code }}</a></li>
      {% empty %}
        <li>هیچی نیست.</li>
      {% endfor %}
    </ul>
  </div>
</div>
</body>
</html>
