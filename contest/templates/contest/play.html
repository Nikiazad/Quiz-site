{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>مسابقه</title>
  <link rel="stylesheet" href="{% static 'contest/style.css' %}">
</head>
<body class="page-play">
<div class="wrap">
    <div id="top">
    <div class="top-side">
      <form method="post" action="{% url 'contest:leave' session.code %}" class="logout">
        {% csrf_token %}
        <button type="submit" class="logout-btn"
          onclick="return confirm('از مسابقه خارج می‌شی؟')">خروج</button>
      </form>
      <span class="p-name" id="p-name">{{ player.name }}</span>
    </div>
    <span class="p-rank" id="p-rank"></span>
    <div class="top-side end">
      <span class="p-score" id="p-score">{{ player.score }} امتیاز</span>
    </div>
  </div>
  <div id="view"></div>
</div>
<script>
const stateUrl = "{% url 'contest:state' session.code %}";
const answerUrl = "{% url 'contest:answer' session.code %}";
const csrf = document.querySelector('meta[name="csrf-token"]').content;
const view = document.getElementById("view");
let lastKey = "";
let sending = false;

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

function mediaEl(m) {
  if (!m) return null;
  const tag = m.type === "image" ? "img" : m.type === "audio" ? "audio" : "video";
  const e = document.createElement(tag);
  e.src = m.url;
  if (m.type !== "image") e.controls = true;
  if (m.type === "video") e.playsInline = true;
  return e;
}

async function sendAnswer(optionId) {
  if (sending) return;
  sending = true;
  view.classList.add("locked");
  try {
    await fetch(answerUrl, {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-CSRFToken": csrf},
      body: JSON.stringify({option_id: optionId}),
    });
  } catch (e) {}
  sending = false;
  view.classList.remove("locked");
  tick();
}

function render(s) {
  /* تغییر ۱: نوار بالا حالا دو بخش جدا دارد (نام و امتیاز) */
  document.getElementById("p-name").textContent = s.player.name;
  document.getElementById("p-score").textContent = s.player.score + " امتیاز";
  document.getElementById("p-rank").textContent = s.my_rank ? "رتبه " + s.my_rank : "";
  const q = s.question;
  const key = s.phase + "|" + (q ? q.id : "") + "|" + (q ? q.my_option : "");

  if (key !== lastKey) {
    lastKey = key;
    view.replaceChildren();
    view.classList.remove("wide");
    if (s.phase === "lobby") {
      view.append(el("h2", "منتظر شروع مسابقه باش", "wait"));
    } else if (q) {
      view.append(el("h2", q.text));
      const m = mediaEl(q.media);
      if (m) view.append(m);
      if (s.phase === "question") {
        const t = el("div", "", "timer");
        t.id = "t";
        view.append(t);
      }
      const box = el("div", "", "opts");
      q.options.forEach(o => {
        const b = el("div", o.text, "opt");
        const om = mediaEl(o.media);
        if (om) {
          if (o.media.type !== "image") {
            om.onclick = ev => ev.stopPropagation();
          }
          b.append(om);
        }
        if (o.id === q.my_option) b.classList.add("chosen");
        if (s.phase === "reveal") {
          b.classList.add(o.is_correct ? "correct" : "wrong");
        } else if (q.my_option === null) {
          b.onclick = () => sendAnswer(o.id);
        }
        box.append(b);
      });
      view.append(box);
      if (s.phase === "question" && q.my_option !== null) {
        view.append(el("p", "جوابت ثبت شد، منتظر بقیه باش", "note"));
      }
      if (s.phase === "reveal") {
        let msg = "جواب ندادی";
        let kind = "none";
        if (q.my_option !== null) {
          if (q.my_points > 0) { msg = "جوابت درست بود! +" + q.my_points + " امتیاز"; kind = "good"; }
          else { msg = "جوابت اشتباه بود."; kind = "bad"; }
        }
        /* تغییر ۲: کلاس نتیجه برای رنگ‌دادن به پیام */
        view.append(el("h3", msg, "result " + kind));
        if (q.explanation) view.append(el("p", q.explanation, "note"));
      }
        } else {
      view.classList.add("wide");
      view.append(el("h2", s.phase === "finished" ? "نتیجه‌ی نهایی" : "لیدربورد"));
      const tb = document.createElement("table");
      tb.className = "lb";
      (s.board || []).forEach((p, i) => {
        const tr = document.createElement("tr");
        [i + 1, p.name, p.score].forEach(v => {
          const td = document.createElement("td");
          td.textContent = v;
          tr.append(td);
        });
        tb.append(tr);
      });
      view.append(tb);
    }
  }

  const t = document.getElementById("t");
  if (t && q) {
    t.textContent = Math.ceil(q.seconds_left);
    /* تغییر ۳: ۵ ثانیه آخر تایمر قرمز می‌شود */
    t.classList.toggle("low", q.seconds_left <= 5);
  }
  view.classList.toggle("timeup", !!(q && s.phase === "question" && q.seconds_left <= 0));
}

async function tick() {
  try {
    const r = await fetch(stateUrl);
    if (r.status === 403) { location.href = "{% url 'contest:join' %}"; return; }
    render(await r.json());
  } catch (e) {}
}
tick();
setInterval(tick, 1500);
</script>
</body>
</html>
