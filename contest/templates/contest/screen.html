{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ session.quiz.title }}</title>
  <link rel="stylesheet" href="{% static 'contest/style.css' %}">
</head>
<body class="page-screen">
<div class="big" id="view"></div>
<script>
const stateUrl = "{% url 'contest:screen_state' session.code %}";
const qrUrl = "{% url 'contest:screen_qr' session.code %}";
const view = document.getElementById("view");
let built = false;

function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

/* صفحه فقط یک بار ساخته می‌شود و هیچ‌وقت عوض نمی‌شود */
function build(s) {
  const cols = el("div", "", "cols");
  const left = document.createElement("div");
  left.append(el("h1", s.title));
  left.append(el("p", "QR رو اسکن کنید یا کد رو وارد کنید:", "mut"));
  left.append(el("div", s.code, "code"));
  const u = el("p", s.join_url, "mut");
  u.dir = "ltr";
  left.append(u);
  const pc = el("h2", "");
  pc.id = "pc";
  left.append(pc);
  const right = el("div", "", "qr");
  const img = document.createElement("img");
  img.src = qrUrl;
  right.append(img);
  cols.append(left, right);
  view.append(cols);
}

function render(s) {
  if (!built) { build(s); built = true; }
  document.getElementById("pc").textContent = s.players + " نفر وارد شدن";
}

async function tick() {
  try { render(await (await fetch(stateUrl)).json()); } catch (e) {}
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
